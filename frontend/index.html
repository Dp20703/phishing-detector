<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Phishing URL Detector | Check a link before you click</title>
    <meta
      name="description"
      content="Paste a URL and get a machine-learning phishing risk score with the warning signs found in the link. Built with scikit-learn, FastAPI and React."
    />
    <meta name="author" content="Darshan" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020617" />
    <!-- REPLACE with your real Vercel URL (also in og:url, og:image, twitter:image below) -->
    <link rel="canonical" href="https://your-app.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Phishing URL Detector" />
    <meta property="og:title" content="Phishing URL Detector" />
    <meta
      property="og:description"
      content="Paste a link and get a machine-learning risk score before you click it."
    />
    <meta property="og:url" content="https://your-app.vercel.app/" />
    <meta property="og:image" content="https://your-app.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Phishing URL Detector logo: a fishing hook inside a blue shield"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phishing URL Detector" />
    <meta
      name="twitter:description"
      content="Paste a link and get a machine-learning risk score before you click it."
    />
    <meta name="twitter:image" content="https://your-app.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Phishing URL Detector logo: a fishing hook inside a blue shield"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript enabled to check URLs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
